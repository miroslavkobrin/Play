<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <style>
    body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e0eafc, #cfdef3);
    font-family: Arial, sans-serif;
}

.game {
    display: flex;
    align-items: center;
    gap: 40px;
    background: #fff;
    padding: 30px 40px;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}

.player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
}

.score-box {
    width: 120px;
    padding: 8px;
    background: #1e90ff;
    color: #fff;
    font-size: 24px;
    font-weight: bold;
    text-align: center;
    border-radius: 8px;
}

.circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: #ffd93d;
    border: 4px solid #222;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 45px;
    font-weight: bold;
}

.gen-btn {
    padding: 18px 30px;
    font-size: 20px;
    font-weight: bold;
    background: #2ed573;
    color: #fff;
    border: none;
    border-radius: 12px;
    cursor: pointer;
}

@media (max-width: 700px) {
    .game {
        flex-direction: column;
        gap: 20px;
    }
}
    </style>
</head>
<body>
    <div class="game">
        <div class="player">
            <h2 id="username" class="player-name">Гравець</h2>
            <div class="score-box" id="userO">0</div>
            <div class="circle" id="user">?</div>
        </div>
        <button id="genBtn" class="gen-btn">Generate</button>
        <div class="player">
            <h2 class="player-name">Computer</h2>
            <div class="score-box" id="computerO">0</div>
            <div class="circle" id="computer">?</div>
        </div>
    </div>
    <script src="Lr8.js"></script>
</body>
</html>
